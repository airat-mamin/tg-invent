brand: PHILIPS
aliases: [PHILIPS, TPV, TP VISION]

model:
  # Обозначение монитора: три цифры диагонали и серии, буква линейки, цифра
  # поколения, буквенный суффикс и код региона через дробь.
  # Примеры: 246V5LSB/01, 273V7QDSB/01, 221S8LDAB/00, 328E1CA/00.
  # Модель продублирована штрихкодом рядом с серийным номером, поэтому по этой
  # форме она опознаётся прямо из декодированного значения.
  token_pattern: ^\d{3}[A-Z]\d?[A-Z]{1,5}(?:/\d{2})?$

# Формат серийного номера (AU0A1718003418) намеренно не описан: подтверждённых
# образцов пока мало, а ошибочный шаблон приведёт к неверной канонизации.
