brand: DELL
aliases: [DELL, DELL INC, DELL COMPUTER, DELL TECHNOLOGIES]

serial:
  # PPID Dell: код страны сборки, номер детали, код производителя,
  # год с неделей выпуска, серийная часть и ревизия.
  # На наклейке печатается с дефисами (CN-0Y71R3-TV200-19B-13QT-A01),
  # в штрихкоде — слитно (CN0Y71R3TV20019B13QTA01).
  pattern: ^(?:CN|MY|TW|SG|MX|BR|IN|PH|TH|CZ|IE)-?0[A-Z0-9]{5}-?[A-Z0-9-]{5,}$
  length: [18, 30]

  # separator — дефисы только разделяют группы и в машинном виде убираются;
  # significant — дефис является частью номера и сохраняется.
  hyphens: separator

  # Разбивка на группы при показе «как на наклейке», по длине машинного вида.
  groups:
    20: [2, 6, 5, 3, 4]
    22: [2, 5, 5, 3, 4, 3]
    23: [2, 6, 5, 3, 4, 3]

  # Точечные исправления типичных ошибок OCR. Применяются только если после
  # правки значение начинает соответствовать pattern.
  fixes:
    - name: буква O вместо нуля после кода страны
      pattern: ^((?:CN|MY|TW|SG|MX|BR|IN|PH|TH|CZ|IE)-?)O
      replacement: \g<1>0

  # Номер детали внутри серийного номера — группа 1. По нему определяется модель.
  part_number: ^[A-Z]{2}-?(0[A-Z0-9]{5})

model:
  # У мониторов Dell обозначение вида E2722H, U2723QE, P2419HC, S2721DGF.
  token_pattern: ^[A-Z]{1,3}\d{3,4}[A-Z]{0,4}$

  # Соответствие номера детали модели. Бот пополняет его сам из подтверждённых
  # карточек, выгрузить накопленное можно командой /parts и вписать сюда.
  by_part:
    0Y71R3: E2722H
    011PWC: S2721HN
    0J0XYN: U2717D
    018GJ7: E2318HN
    05FYJ5: S2340LC
