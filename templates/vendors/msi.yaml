brand: MSI
aliases: [MSI, MICRO-STAR, MICROSTAR]

serial:
  # Наблюдалось на PRO MP275QPG (внутренний код 3PC3): 13 символов,
  # две буквы, цифра, буква завода и девять цифр. Пример: PC3M695500148.
  pattern: ^[A-Z]{2}\d[A-Z]\d{9}$
  length: [13, 13]
  fixes:
    - name: Q вместо нуля в хвосте номера
      pattern: Q
      replacement: "0"
    - name: O вместо нуля в хвосте номера
      pattern: O
      replacement: "0"
    - name: T вместо единицы в хвосте номера
      pattern: T
      replacement: "1"
    - name: I вместо единицы в хвосте номера
      pattern: I
      replacement: "1"

model:
  # На наклейке два обозначения: короткое MODEL NAME (3PC3 / 3PD6) и маркетинговое
  # имя, которое нужно в инвентаризации: PRO MP272L, PRO MP275QPG, MAG 274QRF, G274QPF.
  # Третий «широкий» вариант [A-Z]{2,3}\d{3}[A-Z]{2,6} принимал мусор OCR вроде BZ418UALONC.
  token_pattern: '^(?:(?:PRO|MAG|MPG|MODERN) ?[A-Z]{0,3}\d{3}[A-Z]{0,6}|(?:MP|MD|G)\d{3}[A-Z]{0,4})$'
