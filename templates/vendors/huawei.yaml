brand: HUAWEI
aliases: [HUAWEI, HUAWEI DEVICE]

serial:
  # MateView SE: SHQUH + 11 цифр. Не путать с SHQUN у SSN-24.
  pattern: '^SHQUH\d{11}$'
  length: [16, 16]

model:
  # Маркетинговое имя MateView SE; B3-241H — внутренний код линейки.
  token_pattern: '^(?:MATEVIEW(?: SE)?|B3-\d{3}[A-Z]|S24)$'
