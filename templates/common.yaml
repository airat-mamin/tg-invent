# Общие правила разбора шильдиков, не привязанные к производителю.
# Все регулярные выражения применяются к тексту, приведённому к верхнему регистру
# и латинице (кириллические омоглифы уже заменены).

# Производители, которые бот узнаёт в тексте наклейки. Сравнение нечёткое:
# допускается одна ошибка распознавания в слове длиной от четырёх символов.
brands:
  - DELL
  - HP
  - HEWLETT-PACKARD
  - LENOVO
  - SAMSUNG
  - LG
  - ACER
  - ASUS
  - PHILIPS
  - AOC
  - BENQ
  - VIEWSONIC
  - IIYAMA
  - NEC
  - EIZO
  - HUAWEI
  - XIAOMI
  - MSI
  - GIGABYTE
  - DEXP
  - IRBIS
  - APPLE
  - FUJITSU
  - TOSHIBA

# Метки, после которых на наклейке идёт значение. Группа 1 — само значение.
labels:
  service_tag: >-
    (?:SERVICE\s*TAG|\bS[/\\.]?T\b)\s*[:.#№]?\s*([A-Z0-9]{7})\b
  # «Service Code» намеренно не поддерживается: так начинается Express Service
  # Code — числовой код, который печатается на том же шильдике Dell.

  serial: >-
    (?:\bS[/\\.\s]?N\b|\bSERIAL\s*(?:NO\.?|NUMBER|NUM)?|序列号|序号)\s*[:.#№]?\s*([A-Z0-9][A-Z0-9-]{4,29})\b
  # Границы слова обязательны: без них «SN» находится внутри мусорного текста
  # OCR вроде «SSNATSUNT», и из шума собирается правдоподобный серийный номер.

  model: >-
    (?:MODEL\s*[-–]?\s*(?:NO\.?|NAME|ID)?|\bMDL\b|型号|型號|MONEN[BE8H](?:/[A-Z]{3,12})?|MONEL[BL]?|MODELL?|МОДЕЛЬ|ТИП)[\s:.#№;|]*([A-Z0-9][A-Z0-9\-/]{1,23})\b
  # «MODEL ID» — Philips. MONENB/MONENE — типичный OCR «Модель» при языках en.
  # На наклейках DEXP рядом стоит казахское «Үлгісі», которое OCR читает как
  # YNRICI, поэтому после MONENB допускается второе слово через дробь.

# Поиск модели, когда метки на наклейке нет или она на незнакомом языке.
model:
  # Типовая форма обозначения монитора или ПК: E2722H, U2723QE, P2419HC, T3600.
  token_pattern: \b([A-Z]{1,3}\d{3,4}[A-Z]{0,4})\b
  # Помимо посторонних обозначений сюда входят обрывки самих меток: их легко
  # принять за значение, если метка на наклейке набрана в несколько слов.
  stopwords:
    [CCC, CE, FCC, EAC, HF, XY, AC, DC, HZ, USB, HDMI, LED, LCD, ID, NO, NAME, MDL, SN, PN]

# Что не является идентификатором оборудования.
noise:
  labels: \b(P/?N|PART\s*(?:NO|NUMBER)|FCC\s*ID|EAC|MAC|REV|LOT|BOM)\b
  mac_address: \b(?:[0-9A-F]{2}[:-]){5}[0-9A-F]{2}\b
  # Значения в кавычках: без них YAML превращает NULL в пустое значение.
  values: ["NULL", "NONE", "N/A", "NA", "-", "—", "UNKNOWN", "NOTFOUND", "NOT FOUND"]

# Проверка значений перед сохранением.
validation:
  service_tag: '[A-Z0-9]{7}'
  serial: '[A-Z0-9][A-Z0-9-]{4,29}'
  model: '[A-Z0-9][A-Z0-9\-/ ]{1,24}'
